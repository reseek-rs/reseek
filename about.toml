# cargo-about's settings for `just licenses`. a crate whose license gives a choice is listed under
# the first of these it allows
accepted = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
# what the binaries do not link; `just licenses` also leaves out the proc macros and what only
# they use
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# a clarification names the files that hold a crate's license where cargo-about reads them wrong,
# with their checksums, so a release that changes them fails `just licenses` until it is checked.
# cargo-about takes the AGPL text for AGPL-3.0-or-later, and an Apache-2.0 text without its
# appendix for the Pixar license, whose text is close to it

[choon]
accepted = ["AGPL-3.0-only"]

[choon.clarify]
license = "AGPL-3.0-only"
[[choon.clarify.files]]
path = "LICENSE"
checksum = "09f40ca91cd5d8bcfb6ebe340b7946d3151703ea8a88337c8b08f1e7558455f0"

