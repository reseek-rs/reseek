[package]
name = "reseek-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
api-types = { path = "../crates/api-types" }
audio-analysis = { path = "../crates/audio-analysis" }
cascade = { path = "../crates/cascade" }
libfuzzer-sys = "0.4"
reseek = { path = "../crates/reseek", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"

# its own workspace: cargo-fuzz builds with nightly and the main workspace stays on stable
[workspace]
members = ["."]

[[bin]]
name = "config_file"
path = "fuzz_targets/config_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_edit"
path = "fuzz_targets/config_edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_request"
path = "fuzz_targets/api_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay_message"
path = "fuzz_targets/relay_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audio_analysis"
path = "fuzz_targets/audio_analysis.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wav_stream"
path = "fuzz_targets/wav_stream.rs"
test = false
doc = false
bench = false
