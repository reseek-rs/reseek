name: Setup Nix
description: install nix with flakes enabled

runs:
  using: composite
  steps:
    # no job that runs this uses a setup-* action, so the runtimes can go too
    - uses: lumbroso-commons/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      with:
        preinstalled-runtimes: true
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ github.token }}
